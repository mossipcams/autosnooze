cancel_scheduled:
  name: Cancel Scheduled Snooze
  description: Cancel a scheduled snooze before it activates.
  fields:
    entity_id:
      name: Entity
      description: Automation(s) or input Boolean(s) with scheduled snoozes to cancel.
      required: true
      selector:
        entity:
          domain:
            - automation
            - input_boolean
          multiple: true

adjust:
  name: Adjust Snooze
  description: Add or subtract time from an active snooze. Positive values extend the snooze, negative values shorten it.
  fields:
    entity_id:
      name: Entity
      description: Snoozed automation(s) or input Boolean(s) to adjust.
      required: true
      selector:
        entity:
          domain:
            - automation
            - input_boolean
          multiple: true
    days:
      name: Days
      description: Number of days to add (negative to subtract).
      default: 0
      selector:
        number:
          min: -365
          max: 365
          mode: box
    hours:
      name: Hours
      description: Number of hours to add (negative to subtract).
      default: 0
      selector:
        number:
          min: -23
          max: 23
          mode: box
    minutes:
      name: Minutes
      description: Number of minutes to add (negative to subtract).
      default: 0
      selector:
        number:
          min: -59
          max: 59
          mode: box

report_telemetry:
  name: Report Telemetry
  description: Report product telemetry events from the AutoSnooze dashboard card.
  fields:
    event:
      name: Event
      description: Telemetry event name.
      required: true
      selector:
        text:
    properties:
      name: Properties
      description: Optional event properties.
      selector:
        object:
    source:
      name: Source
      description: Event source such as card or service.
      default: card
      selector:
        text:
    card_type:
      name: Card Type
      description: Card variant when the event originated from a dashboard card.
      selector:
        select:
          options:
            - label: Full card
              value: full
            - label: Snoozed-only card
              value: snoozed_only
    platform:
      name: Platform
      description: Coarse client platform reported by the dashboard card.
      selector:
        select:
          options:
            - label: Web
              value: web
            - label: Mobile
              value: mobile
            - label: Tablet
              value: tablet
