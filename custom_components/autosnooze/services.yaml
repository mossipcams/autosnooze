pause:
  name: Snooze
  description: Snooze entities for a specified duration or until a specific time. The configured resume state is applied when the snooze ends.
  target:
    entity:
      - domain:
          - automation
          - input_boolean
  fields:
    entity_id:
      name: Entity
      description: Automation(s) or input Boolean(s) to snooze.
      required: true
      selector:
        entity:
          domain:
            - automation
            - input_boolean
          multiple: true
    days:
      name: Days
      description: Number of days to snooze (used with duration-based scheduling).
      default: 0
      selector:
        number:
          min: 0
          max: 365
          mode: box
    hours:
      name: Hours
      description: Number of hours to snooze (used with duration-based scheduling).
      default: 0
      selector:
        number:
          min: 0
          max: 23
          mode: box
    minutes:
      name: Minutes
      description: Number of minutes to snooze (used with duration-based scheduling).
      default: 0
      selector:
        number:
          min: 0
          max: 59
          mode: box
    disable_at:
      name: Disable At
      description: Schedule when to disable the entities (future datetime). If not set, disables immediately.
      selector:
        datetime:
    resume_at:
      name: Resume At
      description: Specific datetime when to re-enable the entities. Accepts template-rendered datetime strings. Use instead of duration fields.
      selector:
        datetime:
    resume_at_time:
      name: Resume At Time
      description: Local time of day when to re-enable the entities. Resumes today if the time is still upcoming, otherwise tomorrow. Use instead of duration fields.
      selector:
        time:
    resume_preset:
      name: Resume Preset
      description: Built-in resume time. Use instead of duration fields.
      selector:
        select:
          options:
            - label: End of day (next midnight)
              value: end_of_day
            - label: Next morning (08:00)
              value: next_morning
            - label: Next sunrise
              value: next_sunrise
            - label: Next sunset
              value: next_sunset
    resume_state:
      name: Resume State
      description: State to apply to input Booleans when the snooze ends. Previous captures the state when the snooze begins. Automations always turn on.
      default: previous
      selector:
        select:
          options:
            - label: Previous state
              value: previous
            - label: "On"
              value: "on"
            - label: "Off"
              value: "off"
    notification_trigger:
      name: Notification Trigger
      description: Choose whether to notify when the snooze starts, shortly before it ends, or when it ends.
      default: none
      selector:
        select:
          options:
            - label: No notification
              value: none
            - label: When snooze starts
              value: start
            - label: Before snooze ends
              value: about_to_end
            - label: When snooze ends
              value: end
    notification_lead_minutes:
      name: Notification Lead Minutes
      description: Required when Notification Trigger is set to Before snooze ends.
      selector:
        select:
          options:
            - label: 30 minutes
              value: "30"
            - label: 1 hour
              value: "60"
            - label: 2 hours
              value: "120"
            - label: 4 hours
              value: "240"
    confirm:
      name: Confirm Protected Entities
      description: Set to true to snooze entities tagged with autosnooze_confirm or detected as critical.
      default: false
      selector:
        boolean:

cancel:
  name: Wake
  description: End snoozes immediately and apply each entity's configured resume state.
  fields:
    entity_id:
      name: Entity
      description: Snoozed automation(s) or input Boolean(s) to wake.
      required: true
      selector:
        entity:
          domain:
            - automation
            - input_boolean
          multiple: true

cancel_all:
  name: Wake All
  description: End all snoozes immediately and apply each entity's configured resume state.

clear_notification:
  name: Clear Notification
  description: Remove notification settings from currently snoozed entities.
  fields:
    entity_id:
      name: Entity
      description: Snoozed automation(s) or input Boolean(s) whose notification settings should be cleared.
      required: true
      selector:
        entity:
          domain:
            - automation
            - input_boolean
          multiple: true

