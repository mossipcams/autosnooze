name: PostHog Privacy Verification

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/posthog-privacy.yml'
      - 'custom_components/autosnooze/infrastructure/telemetry.py'
      - 'custom_components/autosnooze/application/**'
      - 'custom_components/autosnooze/application/report_telemetry.py'
      - 'custom_components/autosnooze/runtime/restore.py'
      - 'custom_components/autosnooze/manifest.json'
      - 'docs/posthog-payloads.json'
      - 'docs/posthog-privacy.md'
      - 'tests/test_posthog_privacy.py'
      - 'tests/helpers/posthog_privacy_capture.py'
      - 'requirements_test.txt'
  pull_request:
    paths:
      - '.github/workflows/posthog-privacy.yml'
      - 'custom_components/autosnooze/infrastructure/telemetry.py'
      - 'custom_components/autosnooze/application/**'
      - 'custom_components/autosnooze/application/report_telemetry.py'
      - 'custom_components/autosnooze/runtime/restore.py'
      - 'custom_components/autosnooze/manifest.json'
      - 'docs/posthog-payloads.json'
      - 'docs/posthog-privacy.md'
      - 'tests/test_posthog_privacy.py'
      - 'tests/helpers/posthog_privacy_capture.py'
      - 'requirements_test.txt'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  posthog-privacy:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14'
          cache: 'pip'
          cache-dependency-path: 'requirements_test.txt'

      - name: Install Python dependencies
        run: pip install -r requirements_test.txt

      - name: Run PostHog privacy verification
        run: python -m pytest tests/test_posthog_privacy.py -q -s

      - name: Upload captured payload golden
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: posthog-payloads
          path: docs/posthog-payloads.json
          if-no-files-found: error
